<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden · Armin Fradler</title>
<meta name="robots" content="noindex">
<script>
/* Alte Adressen der bisherigen Website auf die neuen Seiten umleiten.
   Funktioniert sowohl unter der eigenen Domain als auch unter der Vorschau-Adresse (Unterordner). */
(function(){
  var p=location.pathname, base=p.indexOf('/arminfradler-website/')===0?'/arminfradler-website/':'/';
  var rest=p.slice(base.length).replace(/\/+$/,'');
  var map={'training':'angebot.html','services':'angebot.html#betrieb','bildung':'angebot.html#schule','infrastruktur':'angebot.html#betrieb','masssoftware':'angebot.html#betrieb','kontakt':'kontakt.html','impressum':'impressum.html','datenschutz':'datenschutz.html','agb':'agb.html','ueber-mich':'ueber-mich.html','blog':'impulse/','impulse':'impulse/','ki-readiness-check':'https://mitmachen.arminfradler.at/werkzeuge/ki/'};
  /* Bekannte Beiträge haben eigene Seiten (auch unter /blog/). Landet ein Beitrag hier, gibt es ihn nicht mehr: zur Übersicht. */
  var m=rest.match(/^(?:blog|impulse)\/([^\/?#]+)$/);
  var to=m?base+'impulse/':(map[rest]?(map[rest].indexOf('http')===0?map[rest]:base+map[rest]):null);
  if(to)location.replace(to+(location.search&&!m?location.search:''));
})();
</script>
<script>(function(){var b=location.pathname.indexOf('/arminfradler-website/')===0?'/arminfradler-website/':'/';document.write('<link rel="icon" href="'+b+'assets/logo/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="'+b+'assets/logo/apple-touch-icon.png"><link href="'+b+'assets/fonts/fonts.css" rel="stylesheet"><link href="'+b+'assets/site.css" rel="stylesheet">');window.__base=b})();</script>
</head>
<body>
<main>
<section>
  <div class="wrap narrow center">
    <figure class="still" style="--rot:-1.5deg;--w:420px;margin:0 auto 34px"><div class="print"><img id="leer" src="assets/bilder/404.webp" width="1000" height="667" alt="Ein Karteikasten, in dem genau eine Karte fehlt"><span class="ki" title="Mit KI erstellt (gpt-image-2.5-sunburst, 10/2026)"><span aria-hidden="true">KI</span><span class="sr">Mit KI erstellt (gpt-image-2.5-sunburst, 10/2026)</span></span></div></figure>
    <p class="hand" style="font-size:44px;margin-bottom:6px">Hier ist nichts.</p>
    <h1 style="font-size:clamp(28px,4vw,40px)">Diese Seite gibt es nicht (mehr).</h1>
    <p class="lead" style="margin-top:16px">Vielleicht ist sie umgezogen. Von hier aus geht es weiter:</p>
    <p><a class="btn" id="home" href="/">Zur Startseite →</a></p><script>document.getElementById("home").href=window.__base||"/";document.getElementById("leer").src=(window.__base||"/")+"assets/bilder/404.webp"</script>
  </div>
</section>
</main>
</body>
</html>
