name: Impulse bauen
# Ein neuer oder geänderter Beitrag in content/impulse/ (oder neue Bilder) wird automatisch zur fertigen Seite.
on:
  workflow_dispatch:
  push:
    paths: ["content/**", "assets/impulse/**", "tools/build_blog.py", "site.json"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/build_blog.py
      - name: Änderungen übernehmen
        run: |
          git config user.name "Armin Fradler"
          git config user.email "info@arminfradler.at"
          git add -A impulse blog index.html sitemap.xml llms.txt
          git diff --cached --quiet || git commit -m "Impulse automatisch gebaut"
          git push
